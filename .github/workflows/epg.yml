name: Update TiVo EPG

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub con un botón
  push:              # Se ejecuta inmediatamente al hacer push o guardar cambios
    branches:
      - main
      - master
    paths-ignore:
      - 'epg.xml'
      - 'epg.xml.gz'
      - 'README.md'

permissions:
  contents: write

jobs:
  generate-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar EPG desde TiVo
        run: |
          python generator.py

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg.xml.gz
          if git diff --staged --quiet; then
            echo "No hay cambios en la guía EPG."
          else
            git commit -m "Actualización automática de EPG [skip ci]"
            git push
          fi
